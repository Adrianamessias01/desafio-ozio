name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ozio
          POSTGRES_USER: ozio
          POSTGRES_PASSWORD: ozio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ozio -d ozio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-key
      DATABASE_URL: postgres://ozio:ozio@localhost:5432/ozio
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations em dia
        run: python manage.py makemigrations --check --dry-run
      - name: Esquema OpenAPI válido
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Testes
        run: python manage.py test

  frontend:
    name: Front-end (React Router)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Build de produção
        run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir a aplicação
        run: docker compose up -d --build db erp api web
      - name: Esperar o front responder
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Testes de navegador
        run: docker compose --profile e2e run --rm e2e
        env:
          CI: "true"
      - name: Logs da aplicação
        if: failure()
        run: docker compose logs --tail 200
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report
