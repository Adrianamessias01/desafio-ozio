services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ozio
      POSTGRES_USER: ozio
      POSTGRES_PASSWORD: ozio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozio -d ozio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./back
      args:
        INSTALL_DEV: "true"
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-only-insecure-key
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://ozio:ozio@db:5432/ozio
      API_TOKEN: dev-only-api-token
      ERP_SIMULATE_FAILURE: ${ERP_SIMULATE_FAILURE:-False}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./back:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./front
      target: development
    environment:
      # O servidor SSR fala com a API pela rede interna do compose.
      API_BASE_URL: http://api:8000/api
      API_TOKEN: dev-only-api-token
      WATCH_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      # node_modules fica no container, não na pasta do projeto.
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
