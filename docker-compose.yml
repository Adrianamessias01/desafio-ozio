services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ozio
      POSTGRES_USER: ozio
      POSTGRES_PASSWORD: ozio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozio -d ozio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ERP: serviço à parte, com API HTTP própria. O CRM (api) só fala com ele por HTTP.
  # Para simular o ERP fora do ar: `docker compose stop erp` (ou ERP_SIMULATE_FAILURE=True).
  erp:
    build:
      context: ./back
      args:
        INSTALL_DEV: "true"
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-only-insecure-key
      ALLOWED_HOSTS: localhost,127.0.0.1,erp
      DATABASE_URL: postgres://ozio:ozio@db:5432/ozio
      ERP_SERVE_API: "True"
      ERP_API_KEY: dev-only-erp-key
      ERP_SIMULATE_FAILURE: ${ERP_SIMULATE_FAILURE:-False}
      ERP_SIMULATE_LATENCY_MS: ${ERP_SIMULATE_LATENCY_MS:-400}
    command: python manage.py runserver 0.0.0.0:8001
    ports:
      - "8001:8001"
    volumes:
      - ./back:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./back
      args:
        INSTALL_DEV: "true"
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-only-insecure-key
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://ozio:ozio@db:5432/ozio
      SEED_PASSWORD: ozio1234
      ERP_GATEWAY: erp.services.HttpErpGateway
      ERP_BASE_URL: http://erp:8001/erp-api
      ERP_API_KEY: dev-only-erp-key
      # Com o container do ERP parado, cada tentativa espera o DNS do Docker falhar (~3 s).
      ERP_TIMEOUT: "3"
      ERP_RETRIES: "1"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./back:/app
    depends_on:
      db:
        condition: service_healthy
      erp:
        condition: service_started

  web:
    build:
      context: ./front
      target: development
    environment:
      # O servidor SSR fala com a API pela rede interna do compose.
      API_BASE_URL: http://api:8000/api
      SESSION_SECRET: dev-only-session-secret
      WATCH_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      # node_modules fica no container, não na pasta do projeto.
      - /app/node_modules
    depends_on:
      - api

  # Testes de navegador (Playwright). Não sobe com o `up`; rode com:
  #   docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    environment:
      BASE_URL: http://web:3000
      API_URL: http://api:8000/api
      CI: ${CI:-}
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"
    depends_on:
      - web

volumes:
  pgdata:
